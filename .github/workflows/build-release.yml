name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      YARN_NODE_LINKER: node-modules

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install
        run: node .yarn/releases/yarn-3.5.1.cjs install --immutable

      - name: Smoke test
        run: node .yarn/releases/yarn-3.5.1.cjs smoke

      - name: Build (${{ matrix.platform }})
        run: node .yarn/releases/yarn-3.5.1.cjs electron-builder --${{ matrix.platform }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/M3U8-Downloader-*.exe
            dist/M3U8-Downloader-*.zip
            dist/M3U8-Downloader-*.dmg
            dist/M3U8-Downloader-*.AppImage
            dist/M3U8-Downloader-*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
